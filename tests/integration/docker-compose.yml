services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: crm_test
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm_test"]
      interval: 2s
      timeout: 5s
      retries: 15
