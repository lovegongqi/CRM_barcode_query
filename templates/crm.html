<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM 条码查询</title>
    <link rel="stylesheet" href="/static/log_modal.css">
    <script src="/static/log_modal.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(180deg,#eaf1fb 0,#f7f9fc 320px,#f7f9fc 100%); color: #202938; min-height: 100vh; }
        .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
        .header { display:flex; flex-direction:column; align-items:stretch; gap:12px; margin-bottom:20px; }
        .header h1 { font-size: 26px; color: #202938; margin-bottom: 6px; }
        .header p { color: #667085; font-size: 13px; }
        .page-nav { display:flex; gap:6px; flex-wrap:nowrap; justify-content:flex-start; align-items:center; width:100%; }
        .page-nav a { flex:0 0 calc((100% - 24px)/5); width:calc((100% - 24px)/5); min-width:0; max-width:calc((100% - 24px)/5); display:inline-flex; align-items:center; justify-content:center; min-height:34px; padding:0 3px; font-size:11px; line-height:1; font-weight:800; color:#667085; text-decoration:none; border:1px solid #d9e1ec; border-radius:6px; background:#fff; white-space:nowrap; }
        .page-nav a.active { background:#2563eb; color:#fff; border-color:#2563eb; }
        .page-nav a:hover { border-color:#bfdbfe; color:#2563eb; }
        .page-nav a.active:hover { color:#fff; }
        .status-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding: 12px 16px; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 6px 18px rgba(15,23,42,.06); }
        .status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color:#334155; font-weight:700; }
        .status-actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
        .status-bar .progress-bar { flex-basis:100%; width:100%; margin-top:2px; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; box-shadow: 0 0 0 3px rgba(148,163,184,.16); }
        .status-dot.green { background: #28a745; }
        .status-dot.red { background: #dc3545; }
        .status-dot.gray { background: #999; }
        .card { background: rgba(255,255,255,.96); border-radius: 8px; padding: 24px; border: 1px solid #d9e1ec; margin-bottom: 20px; box-shadow: 0 10px 28px rgba(15,23,42,.08); }
        .card h2 { font-size: 16px; color: #333; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid #eee; }
        .card-head h2 { margin:0; padding:0; border:0; }
        .crm-actions { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
        .crm-actions .btn { min-height:34px; padding:6px 12px; font-size:12px; white-space:nowrap; }
        .form-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: #666; font-weight: 500; }
        .form-group input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #4472C4; }
        .query-actions { align-items: flex-end; }
        .btn { min-height: 38px; padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 800; border: none; transition: all 0.2s; box-shadow: 0 1px 2px rgba(15,23,42,.08); }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #ccc; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #2563eb; color: #fff; }
        .btn-success:hover { background: #1d4ed8; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-secondary:hover { background: #5a6268; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; font-family: monospace; resize: vertical; outline: none; }
        textarea:focus { border-color: #4472C4; }
        .log-area { background: #0f172a; color: #d4d4d4; border-radius: 8px; padding: 14px; font-family: 'Courier New', monospace; font-size: 13px; max-height: 400px; overflow-y: auto; line-height: 1.8; }
        .log-area .info { color: #4fc3f7; }
        .log-area .success { color: #81c784; }
        .log-area .error { color: #e57373; }
        .log-area .warn { color: #ffb74d; }
        .log-area .dim { color: #888; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .hint { font-size: 12px; color: #999; margin-top: 4px; }
        .progress-bar { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
        .progress-bar.show { display: block; }
        .progress-bar .bar { height: 100%; background: #4472C4; transition: width 0.3s; width: 0%; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
        .auth-card { display:flex; align-items:center; justify-content:space-between; gap:16px; }
        .auth-card p { color:#667085; font-size:13px; margin-top:6px; }
        .auth-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
        .modal-overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(15,23,42,.52); z-index: 1000; padding: 18px;
        }
        .modal-overlay.show { display: flex; }
        .login-modal {
            width: min(460px, 100%);
            background: #fff;
            border: 1px solid #d9e1ec;
            border-radius: 10px;
            box-shadow: 0 28px 70px rgba(15,23,42,.30);
            overflow: hidden;
        }
        .login-modal-head {
            display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding: 18px 20px; border-bottom: 1px solid #e5eaf2; background:#f8fbff;
        }
        .login-modal-head h3 { font-size: 17px; color:#202938; }
        .modal-close { border:none; background:transparent; color:#667085; font-size:22px; line-height:1; }
        .login-modal-body { padding: 18px 20px 20px; }
        .login-modal-body .form-row { flex-direction: column; align-items: stretch; gap: 12px; }
        .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 760px) {
            .container { padding: 14px; }
            .form-row { align-items: stretch; flex-direction: column; }
            .form-group { width: 100%; }
            .status-bar { align-items: center; flex-direction: row; flex-wrap: wrap; }
            .status-actions { margin-left:auto; justify-content:flex-end; }
            .card-head { align-items:center; }
        }
    </style>
    <link rel="stylesheet" href="/static/app_layout.css">
    <link rel="stylesheet" href="/static/aurora.css">
    <script defer src="/static/aurora.js"></script>
</head>
<body data-aurora-page="query">
    <a class="aurora-logo" href="/" aria-label="怡口 CRM 首页"><img src="/static/ecowater-logo.png" alt="EcoWater 怡口净水"></a>
    <div class="container">
        <div class="header">
            <div>
                <h1>CRM 在线查询</h1>
                <p>负责 CRM 登录和批量查询；切换页面不会中断后台任务。</p>
            </div>
            <div class="page-nav">
                {% for link in nav_links %}
                <a href="{{ link.href }}" class="{{ 'active' if link.href == '/crm' else '' }}">{{ link.label }}</a>
                {% endfor %}
            </div>
        </div>

        <div class="status-bar aurora-account-status" id="statusBar">
            <div class="status-item">
                <span class="status-dot gray" id="browserDot"></span>
                <span id="browserStatus">浏览器</span>
            </div>
            <div class="status-item">
                <span class="status-dot gray" id="loginDot"></span>
                <span>CRM：</span><span id="loginStatus">未登录</span>
            </div>
            {% if not is_desktop_app %}
            <div class="aurora-account-session">
                <span class="aurora-account-name" id="appAccountStatus">检测中</span>
                <a class="aurora-account-logout" href="/logout">退出工具账号</a>
            </div>
            {% endif %}
            <div class="progress-bar" id="loginProgress">
                <div class="bar" id="loginProgressBar"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <h2>查询条码</h2>
                <div class="crm-actions">
                    <button class="btn btn-primary" id="loginBtn" onclick="openLoginModal()">批量登录 CRM</button>
                    <button class="btn btn-danger" id="logoutBtn" onclick="doLogout()" style="display:none">退出登录</button>
                </div>
            </div>
            <div class="form-group">
                <label>条码查询（可一行一个，也可用逗号、空格分隔）</label>
                <textarea id="batchInput" oninput="saveQueryInput()" inputmode="latin" lang="en" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="ime-mode:inactive" placeholder="6923445601003
6923445601004,6923445601005
6923445601006 6923445601007"></textarea>
            </div>
            <div class="form-row query-actions">
                <button class="btn btn-success" id="batchQueryBtn" onclick="doBatchQuery()">开始查询</button>
                <button class="btn btn-danger" id="stopBatchBtn" onclick="stopBatch()" style="display:none">停止当前查询</button>
                <button class="btn btn-secondary" type="button" onclick="clearQueryInput()">清空输入框</button>
            </div>
            <div class="progress-bar" id="queryProgress">
                <div class="bar" id="queryProgressBar"></div>
            </div>
        </div>

        <div class="card aurora-realtime">
            <div class="aurora-realtime-head">
                <h2>实时查询队列</h2>
                <div class="aurora-live-group">
                    <span class="aurora-live-badge" id="queryBatchSummary"><span class="aurora-live-dot"></span>完成:0/0 失败:0 耗时:0h:0m:0s</span>
                    <button type="button" class="aurora-live-action" id="retryFailedBarcodesBtn" onclick="retryFailedBarcodes()" hidden>失败条码重查</button>
                </div>
            </div>
            <div class="aurora-query-table-wrap">
                <table class="aurora-query-table">
                    <thead><tr><th>#</th><th>条码</th><th>查询通道</th><th>最新日志</th><th>查询状态</th><th>耗时</th></tr></thead>
                    <tbody id="queryRealtimeRows"><tr><td colspan="6"><div class="aurora-empty">输入条码并开始查询后，将在这里逐条显示实时状态</div></td></tr></tbody>
                </table>
            </div>
            <div class="log-area aurora-raw-log" id="logArea" aria-hidden="true"><div class="dim">等待操作...</div></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="modal-overlay" id="loginModal" onclick="if(event.target.id==='loginModal')cancelLogin()">
        <div class="login-modal">
            <div class="login-modal-head">
                <h3>登录 CRM</h3>
                <button class="modal-close" onclick="cancelLogin()">×</button>
            </div>
            <div class="login-modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>账号</label>
                        <input type="text" id="loginUsername" placeholder="CRM 用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" placeholder="密码">
                    </div>
                </div>
                <label style="display:flex;align-items:center;gap:8px;margin:4px 0 12px;">
                    <input type="checkbox" id="rememberCrmLogin"> 记住账号密码
                </label>
                <div class="form-row" id="captchaRow" style="display:none">
                    <div class="form-group" style="flex:1">
                        <label>短信验证码</label>
                        <input type="text" id="captchaInput" placeholder="输入收到短信验证码" maxlength="6">
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="cancelLogin()">取消</button>
                    <button class="btn btn-primary" id="modalLoginBtn" onclick="doLogin()">批量登录</button>
                    <button class="btn btn-primary" id="captchaSubmitBtn" onclick="doLoginStep2()" style="display:none">提交验证码</button>
                    <button class="btn btn-secondary" id="resetLoginBtn" onclick="restartLogin()" style="display:none">重新登录</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let queryQueue = [];
        let isBatchRunning = false;
        let batchStartPending = false;
        let queryCount = 0;
        let lastBatchLogSeq = 0;
        let currentQuerySlot = localStorage.getItem('crm_query_slot') || 'query-1';
        let querySlots = [];
        let isMultiBatchRunning = false;
        let multiBatchJobs = {};
        let currentBackgroundQueryJobId = sessionStorage.getItem('crm_background_query_job_id') || '';
        let multiBatchPollTimer = null;
        let querySharedSyncTimer = null;
        let isMultiBatchPolling = false;
        let pendingLoginSlots = [];
        let currentLoginJobId = sessionStorage.getItem('crm_bulk_login_job_query') || '';
        let loginPollTimer = null;
        let lastLoginLogSeq = 0;
        let lastQueryItems = [];
        let lastQuerySummary = {completed: 0, total: 0, elapsedSeconds: 0};
        try {
            lastQuerySummary = JSON.parse(sessionStorage.getItem('crm_last_query_summary') || 'null') || lastQuerySummary;
        } catch (e) {
            sessionStorage.removeItem('crm_last_query_summary');
        }

        function slotPayload(extra={}) {
            return Object.assign({slot_id: currentQuerySlot, kind: 'query'}, extra);
        }

        function slotLoginPayload(slot, extra={}) {
            return Object.assign({slot_id: slot.id, kind: slot.kind || 'query'}, extra);
        }

        function isLoggedInMessage(message) {
            return ['已登录（会话有效）', '登录成功', '登录成功（页面已跳转）'].includes(message || '');
        }

        function applyCrmCredentialValues(remember, username='', password='', usernameId='loginUsername', passwordId='loginPassword', rememberId='rememberCrmLogin') {
            const rememberEl = document.getElementById(rememberId);
            const usernameEl = document.getElementById(usernameId);
            const passwordEl = document.getElementById(passwordId);
            if (rememberEl) rememberEl.checked = !!remember;
            if (remember) {
                localStorage.setItem('crm_remember_credentials', '1');
                localStorage.setItem('crm_username', username || '');
                localStorage.setItem('crm_password', password || '');
                if (usernameEl) usernameEl.value = username || '';
                if (passwordEl) passwordEl.value = password || '';
            } else {
                localStorage.removeItem('crm_remember_credentials');
                localStorage.removeItem('crm_username');
                localStorage.removeItem('crm_password');
                if (passwordEl) passwordEl.value = '';
            }
        }

        async function loadSavedCrmCredentials(usernameId='loginUsername', passwordId='loginPassword', rememberId='rememberCrmLogin') {
            const localRemember = localStorage.getItem('crm_remember_credentials') === '1';
            const localUsername = localStorage.getItem('crm_username') || '';
            const localPassword = localStorage.getItem('crm_password') || '';
            applyCrmCredentialValues(localRemember, localUsername, localPassword, usernameId, passwordId, rememberId);
            try {
                const data = await fetch('/api/crm/credentials').then(res => res.json());
                if (!data || !data.success) return;
                if (data.remember) {
                    applyCrmCredentialValues(true, data.username || '', data.password || '', usernameId, passwordId, rememberId);
                } else if (localRemember && localUsername && localPassword) {
                    saveCrmCredentials(localUsername, localPassword, rememberId);
                } else {
                    applyCrmCredentialValues(false, '', '', usernameId, passwordId, rememberId);
                }
            } catch (e) {}
        }

        function saveCrmCredentials(username, password, rememberId='rememberCrmLogin') {
            const remember = !!document.getElementById(rememberId)?.checked;
            applyCrmCredentialValues(remember, username || '', password || '', 'loginUsername', 'loginPassword', rememberId);
            fetch('/api/crm/credentials', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({remember, username, password})
            }).catch(() => {});
        }

        async function loadSlots() {
            const data = await fetch('/api/crm/slots').then(r => r.json()).catch(() => null);
            if (!data || !data.success) return;
            querySlots = data.query || [];
            const previousSlot = currentQuerySlot;
            if (!querySlots.some(slot => slot.id === currentQuerySlot)) {
                currentQuerySlot = (data.defaults && data.defaults.query) || (querySlots[0] && querySlots[0].id) || 'query-1';
                localStorage.setItem('crm_query_slot', currentQuerySlot);
            }
            if (currentQuerySlot !== previousSlot) restoreQueryInput();
        }

        function queryInputStorageKey(slotId=currentQuerySlot) {
            return `crm_query_input_${slotId}`;
        }

        function saveQueryInput() {
            sessionStorage.setItem(queryInputStorageKey(), document.getElementById('batchInput').value);
        }

        function restoreQueryInput() {
            let savedBarcodeText = sessionStorage.getItem(queryInputStorageKey());
            const legacyText = sessionStorage.getItem('crm_query_input');
            if (!savedBarcodeText && legacyText) {
                savedBarcodeText = legacyText;
                sessionStorage.setItem(queryInputStorageKey(), legacyText);
                sessionStorage.removeItem('crm_query_input');
            }
            document.getElementById('batchInput').value = savedBarcodeText || '';
        }

        function log(msg, type='') {
            const area = document.getElementById('logArea');
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            area.appendChild(line);
            area.scrollTop = area.scrollHeight;
            if (window.globalLogAppend) window.globalLogAppend(msg, type || 'dim');
        }

        function appendServerLog(entry) {
            const area = document.getElementById('logArea');
            const line = document.createElement('div');
            line.className = entry.level || '';
            line.textContent = `[${entry.time}] ${entry.message}`;
            area.appendChild(line);
            if (window.globalLogAppend) window.globalLogAppend(entry.message || '', entry.level || 'dim', entry.time || '');
            lastBatchLogSeq = Math.max(lastBatchLogSeq, Number(entry.id || 0));
            while (area.children.length > 5000) {
                area.removeChild(area.firstChild);
            }
            area.scrollTop = area.scrollHeight;
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function rememberQueryNotice(message) {
            if (!multiBatchJobs) return;
            if (!Array.isArray(multiBatchJobs.notices)) multiBatchJobs.notices = [];
            multiBatchJobs.notices.push(message);
            multiBatchJobs.notices = multiBatchJobs.notices.slice(-5);
        }

        function rememberFailedBarcode(barcode) {
            if (!barcode || !multiBatchJobs) return;
            if (!Array.isArray(multiBatchJobs.failedBarcodes)) multiBatchJobs.failedBarcodes = [];
            if (!multiBatchJobs.failedBarcodes.includes(barcode)) {
                multiBatchJobs.failedBarcodes.push(barcode);
            }
        }

        function formatDuration(seconds) {
            seconds = Math.max(0, Math.floor(Number(seconds) || 0));
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            if (hours) return `${hours}小时${minutes}分${secs}秒`;
            if (minutes) return `${minutes}分${secs}秒`;
            return `${secs}秒`;
        }

        function queryVisibleItems(items) {
            return (Array.isArray(items) ? items : [])
                .filter(item => ['running', 'error', 'stopped'].includes(String(item && item.state || '').toLowerCase()));
        }

        function queryDisplayItems() {
            const active = queryVisibleItems(multiBatchJobs && multiBatchJobs.items);
            if (multiBatchJobs && multiBatchJobs.job_id) return active;
            return queryVisibleItems(lastQueryItems);
        }

        function queryItemByBarcode(barcode) {
            return queryDisplayItems().find(item => item.barcode === barcode) || null;
        }

        function appendQueryItemLog(item, entry) {
            if (!item) return;
            if (!Array.isArray(item.logs)) item.logs = [];
            const row = typeof entry === 'string'
                ? {time: new Date().toLocaleTimeString(), message: entry, level: 'dim'}
                : {time: entry.time || new Date().toLocaleTimeString(), message: entry.message || '', level: entry.level || 'dim'};
            item.logs.push(row);
            item.logs = item.logs.slice(-120);
            const text = row.message || '';
            if (/重试|第\s*\d+\s*次/.test(text)) item.retries = Math.max(item.retries || 0, Number((text.match(/第\s*(\d+)\s*次/) || [])[1] || 1));
            if (/报表|获取/.test(text)) item.status = '获取 CRM 报表';
            else if (/登录/.test(text)) item.status = '验证 CRM 会话';
            else if (/查询/.test(text) && !/完成|成功|失败/.test(text)) item.status = '正在查询 CRM';
        }

        function latestQueryLogMessage(item, fallback='') {
            const logs = Array.isArray(item && item.logs) ? item.logs : [];
            const latest = logs.length ? logs[logs.length - 1] : null;
            if (!latest) return fallback || item.status || '等待查询';
            const message = typeof latest === 'string' ? latest : (latest.message || '');
            const time = typeof latest === 'object' && latest.time ? `${latest.time} · ` : '';
            return `${time}${message || fallback || item.status || '等待查询'}`;
        }

        function queryStatePresentation(item) {
            const state = String(item && item.state || '').toLowerCase();
            if (state === 'success') return {label: '查询成功', className: 'success'};
            if (state === 'error' || state === 'stopped') return {label: '查询失败', className: 'error'};
            if (state === 'running') return {label: '查询中', className: ''};
            return {label: '等待查询', className: 'warn'};
        }

        function queryItemLogKey(item) {
            return `query:${item.order || 0}:${item.barcode || ''}`;
        }

        function queryItemLogMeta(item) {
            const queryState = queryStatePresentation(item);
            return {
                '查询通道': item.slot_label || '自动调度',
                '查询状态': queryState.label,
                '重试次数': item.retries || 0,
                '耗时': item.elapsed ? formatDuration(item.elapsed) : '进行中'
            };
        }

        function renderQueryRealtime(statusText='') {
            const body = document.getElementById('queryRealtimeRows');
            if (!body) return;
            const items = queryDisplayItems();
            if (!items.length) {
                body.innerHTML = '<tr><td colspan="6"><div class="aurora-empty">当前无查询中或失败条码</div></td></tr>';
                return;
            }
            body.innerHTML = items.map((item, index) => {
                const elapsed = item.startedAt && !['success', 'error', 'stopped'].includes(item.state)
                    ? Math.max(item.elapsed || 0, Math.floor((Date.now() - item.startedAt) / 1000))
                    : (item.elapsed || 0);
                const queryState = queryStatePresentation(item);
                const latestLog = latestQueryLogMessage(item, statusText);
                return `<tr>
                    <td>${item.order || index + 1}</td>
                    <td><code>${escapeHtml(item.barcode)}</code></td>
                    <td>${escapeHtml(item.slot_label || '自动调度')}</td>
                    <td><button type="button" class="aurora-log-preview" onclick="openQueryItemLog(${index})" title="查看该条码完整日志">${escapeHtml(latestLog)}</button></td>
                    <td><span class="aurora-status-button ${queryState.className}">${queryState.label}</span></td>
                    <td>${elapsed ? escapeHtml(formatDuration(elapsed)) : '—'}</td>
                </tr>`;
            }).join('');
            if (window.refreshAuroraLog) {
                items.forEach(item => refreshAuroraLog(
                    queryItemLogKey(item),
                    `条码 ${item.barcode}`,
                    item.logs || [],
                    queryItemLogMeta(item),
                    '条码完整查询日志'
                ));
            }
        }

        function openQueryItemLog(index) {
            const item = queryDisplayItems()[index];
            if (!item) return;
            openAuroraLog(
                `条码 ${item.barcode}`,
                item.logs || [],
                queryItemLogMeta(item),

        function formatBatchElapsed(seconds) {
            const totalSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            return `${hours}h:${minutes}m:${totalSeconds % 60}s`;
        }

        function terminalQueryItemCount(items) {
            return (Array.isArray(items) ? items : [])
                .filter(item => ['success', 'error', 'stopped'].includes(item.state)).length;
        }

        function queryBatchSummarySnapshot() {
            if (multiBatchJobs && multiBatchJobs.total) {
                const total = Number(multiBatchJobs.total || 0);
                const startedAtMs = Number(multiBatchJobs.startedAtMs || 0) || Date.parse(multiBatchJobs.started_at || '');
                const endedAtMs = Number(multiBatchJobs.finishedAtMs || 0) || Date.now();
                const completed = Math.max(
                    Number(multiBatchJobs.completed || 0),
                    terminalQueryItemCount(multiBatchJobs.items)
                );
                const failedItems = (multiBatchJobs && Array.isArray(multiBatchJobs.failedBarcodes)) ? multiBatchJobs.failedBarcodes.length : 0;
                const failedCount = Number(multiBatchJobs.failedCount || failedItems || 0);
                return {
                    total,
                    failed: failedCount,
                    failedBarcodes: failedItems,
                    completed: Math.min(total, completed),
                    total,
                    elapsedSeconds: Number.isFinite(startedAtMs) && startedAtMs > 0
                        ? Math.max(0, Math.floor((endedAtMs - startedAtMs) / 1000))
                        : 0
                };
            }
            return {
                completed: Number(lastQuerySummary.completed || 0),
                total: Number(lastQuerySummary.total || 0),
                failed: Number(lastQuerySummary.failed || 0),
                failedBarcodes: Number(lastQuerySummary.failedBarcodes || 0),
                elapsedSeconds: Number(lastQuerySummary.elapsedSeconds || 0)
            };
        }

        function renderQueryBatchSummary() {
            const target = document.getElementById('queryBatchSummary');
            if (!target) return;
            const summary = queryBatchSummarySnapshot();
            target.innerHTML = `<span class="aurora-live-dot"></span>完成:${summary.completed}/${summary.total} 失败:${summary.failed || 0} 耗时:${formatBatchElapsed(summary.elapsedSeconds)}`;
            const retryBtn = document.getElementById('retryFailedBarcodesBtn');
            if (retryBtn) {
                const failedList = (multiBatchJobs && Array.isArray(multiBatchJobs.failedBarcodes))
                    ? multiBatchJobs.failedBarcodes
                    : (lastQuerySummary && Array.isArray(lastQuerySummary.failedBarcodesList) ? lastQuerySummary.failedBarcodesList : []);
                const uniqueFailed = Array.from(new Set(failedList || []));
                const shouldShow = uniqueFailed.length > 0 && !isBatchRunning && !isMultiBatchRunning;
                retryBtn.hidden = !shouldShow;
                retryBtn.textContent = uniqueFailed.length ? `失败条码重查 (${uniqueFailed.length})` : '失败条码重查';
            }
        }

        function captureLastQuerySummary() {
            if (!multiBatchJobs || !multiBatchJobs.total) return;
            if (!multiBatchJobs.finishedAtMs) multiBatchJobs.finishedAtMs = Date.now();
            lastQuerySummary = queryBatchSummarySnapshot();
            lastQuerySummary.failedBarcodesList = Array.from(new Set(multiBatchJobs.failedBarcodes || []));
            sessionStorage.setItem('crm_last_query_summary', JSON.stringify(lastQuerySummary));
            renderQueryBatchSummary();
        }

        function renderQuerySummary(statusText='查询中') {
            const area = document.getElementById('logArea');
            renderQueryBatchSummary();
            if (!area || !multiBatchJobs || !multiBatchJobs.total) return;
            const rows = multiSlotRows();
            const runningBarcodes = rows
                .filter(row => row.running && row.barcode)
                .map(row => {
                    const startedAt = Number(row.startedAt || 0);
                    const elapsed = startedAt ? Math.max(0, Math.floor((Date.now() - startedAt) / 1000)) : 0;
                    return `${row.barcode}（${elapsed}秒）`;
                });
            const total = multiBatchJobs.total || 0;
            const completed = multiBatchJobs.completed || 0;
            const success = multiBatchJobs.successCount || 0;
            const failed = multiBatchJobs.failedCount || 0;
            const pending = Math.max(
                0,
                Number(multiBatchJobs.pendingCount ?? (multiBatchJobs.pending || []).length)
            );
            const failedBarcodes = Array.from(new Set(multiBatchJobs.failedBarcodes || []));
            const notices = (multiBatchJobs.notices || []).slice(-3);
            const startedMs = Number(multiBatchJobs.startedAtMs || 0) || Date.parse(multiBatchJobs.started_at || '');
            const elapsedText = Number.isFinite(startedMs) && startedMs > 0
                ? formatDuration((Date.now() - startedMs) / 1000)
                : '';
            const elapsedLabel = ['查询完成', '查询已停止'].includes(statusText) ? '总耗时' : '已耗时';
            const runningText = runningBarcodes.length
                ? `正在查询 ${runningBarcodes.length} 个：${runningBarcodes.map(escapeHtml).join('，')}`
                : (pending ? (rows.length ? '等待空闲通道领取条码' : '等待查询通道登录后领取条码') : '没有正在查询的条码');
            area.innerHTML = `
                <div class="info">[${new Date().toLocaleTimeString()}] ${escapeHtml(statusText)}</div>
                <div>总条码数：${total}</div>
                <div>已完成：${completed}/${total}　成功：${success}　失败：${failed}　待查询：${pending}</div>
                ${elapsedText ? `<div>${elapsedLabel}：${escapeHtml(elapsedText)}</div>` : ''}
                <div class="dim">${runningText}</div>
                ${runningBarcodes.length ? '<div class="dim">同一条码等待时间变长，通常是在等 CRM 报表返回；失败后会按重试上限继续查。</div>' : ''}
                ${failedBarcodes.length ? `<div class="error">失败条码：${failedBarcodes.map(escapeHtml).join('，')}</div>` : '<div class="dim">失败条码：无</div>'}
                ${notices.map(msg => `<div class="warn">${escapeHtml(msg)}</div>`).join('')}
            `;
            area.scrollTop = area.scrollHeight;
            renderQueryRealtime(statusText);
        }

        function getUniqueBarcodesFromInput() {
            const barcodes = parseBarcodeText(document.getElementById('batchInput').value.trim());
            const seen = new Set();
            const uniqueBarcodes = barcodes.filter(b => {
                if (seen.has(b)) return false;
                seen.add(b);
                return true;
            });
            const dupCount = barcodes.length - uniqueBarcodes.length;
            if (dupCount > 0) {
                log(`发现 ${dupCount} 个重复条码，已自动去除`, 'warn');
            }
            return uniqueBarcodes;
        }

        async function checkStatus() {
            if (document.hidden) return;
            try {
                refreshAppAccountStatus();
                await loadSlots();
                const browserDot = document.getElementById('browserDot');
                const loginDot = document.getElementById('loginDot');
                const loginStatus = document.getElementById('loginStatus');
                const loginBtn = document.getElementById('loginBtn');
                const logoutBtn = document.getElementById('logoutBtn');
                const batchQueryBtn = document.getElementById('batchQueryBtn');
                const totalSlots = querySlots.length || 1;
                const loggedSlots = querySlots.filter(slot => slot.logged_in).length;
                const browserRunning = querySlots.some(slot => slot.browser_running);

                if (loggedSlots > 0) {
                    browserDot.className = 'status-dot green';
                    loginDot.className = 'status-dot green';
                    loginStatus.textContent = `已登录 ${loggedSlots}/${totalSlots}`;
                    loginBtn.style.display = loggedSlots < totalSlots ? '' : 'none';
                    logoutBtn.style.display = '';

                    browserDot.className = 'status-dot green';
                    loginDot.className = 'status-dot red';
                    loginStatus.textContent = '未登录';
                    loginBtn.style.display = '';
                    logoutBtn.style.display = 'none';
                    batchQueryBtn.disabled = isBatchRunning || batchStartPending || isMultiBatchRunning;
                } else {
                    browserDot.className = 'status-dot gray';
                    loginDot.className = 'status-dot gray';
                    loginStatus.textContent = '未启动';
                    loginBtn.style.display = '';
                    logoutBtn.style.display = 'none';

        function appendLoginServerLog(entry) {

            const area = document.getElementById('logArea');

            line.className = entry.level || '';
            line.textContent = `[${entry.time || new Date().toLocaleTimeString()}] ${entry.message || ''}`;
            area.appendChild(line);
            area.scrollTop = area.scrollHeight;
            if (window.globalLogAppend) {
                window.globalLogAppend(entry.message || '', entry.level || 'dim', entry.time || '', `bulk-login-query:${currentLoginJobId}:${entry.id}`);
            }
            lastLoginLogSeq = Math.max(lastLoginLogSeq, Number(entry.id || 0));
        }

        function renderBulkLoginStatus(data) {
            if (!data || !data.success) return;
            currentLoginJobId = data.job_id || currentLoginJobId;
            if (currentLoginJobId) sessionStorage.setItem('crm_bulk_login_job_query', currentLoginJobId);
            (data.logs || []).forEach(appendLoginServerLog);
            pendingLoginSlots = data.pending_slots || [];

            const total = Number(data.total || 0);
            const doneCount = Number(data.success_count || 0) + Number(data.failed_count || 0);
            if (total) setProgress('loginProgressBar', Math.min(100, Math.round((doneCount / total) * 100)));

            const modalLoginBtn = document.getElementById('modalLoginBtn');
            if (data.running || data.waiting_captcha) {
                document.getElementById('loginModal').classList.add('show');
                document.getElementById('loginProgress').classList.add('show');
                modalLoginBtn.disabled = true;
                modalLoginBtn.textContent = data.waiting_captcha ? '等待验证码' : '登录中...';
            }

            if (data.waiting_captcha) {
                document.getElementById('captchaRow').style.display = '';
                modalLoginBtn.style.display = 'none';
                document.getElementById('captchaSubmitBtn').style.display = '';
                document.getElementById('resetLoginBtn').style.display = '';
                document.getElementById('loginPassword').value = '';
                if (!data.captcha_received) {
                    document.getElementById('captchaSubmitBtn').disabled = false;
                    document.getElementById('captchaSubmitBtn').textContent = '提交验证码';
                }
                const captchaInput = document.getElementById('captchaInput');
                if (!captchaInput.value) captchaInput.focus();
            }

            if (data.captcha_received && data.running) {
                document.getElementById('captchaSubmitBtn').disabled = true;
                document.getElementById('captchaSubmitBtn').textContent = '验证码已提交';
            }

            if (data.done) {
                if (loginPollTimer) clearInterval(loginPollTimer);
                loginPollTimer = null;
                document.getElementById('loginProgress').classList.remove('show');
                modalLoginBtn.disabled = false;
                modalLoginBtn.textContent = '批量登录';
                document.getElementById('captchaSubmitBtn').disabled = false;
                document.getElementById('captchaSubmitBtn').textContent = '提交验证码';
                if (data.login_success) {
                    closeLoginModal();
                    document.getElementById('captchaRow').style.display = 'none';
                    document.getElementById('resetLoginBtn').style.display = 'none';
                    document.getElementById('captchaInput').value = '';
                    sessionStorage.removeItem('crm_bulk_login_job_query');
                    currentLoginJobId = '';
                    showToast('批量登录成功');
                } else if (!data.waiting_captcha) {
                    document.getElementById('resetLoginBtn').style.display = '';
                    showToast(data.error || '部分通道未登录');
                }
                checkStatus();
            }
        }

            const password = document.getElementById('loginPassword').value;
            if (!username || !password) { showToast('请输入账号密码'); return; }

            log('开始批量登录查询通道...', 'info');

                const r = await fetch('/api/crm/bulk-login/start', {
                    method: 'POST',

                btn.textContent = '批量登录';

        function applyBackgroundQueryStatus(data) {
            if (!data || !data.success || !data.job_id) return false;
            if (currentBackgroundQueryJobId && currentBackgroundQueryJobId !== data.job_id) {
                lastBatchLogSeq = 0;
            }
            currentBackgroundQueryJobId = data.job_id;
            sessionStorage.setItem('crm_background_query_job_id', currentBackgroundQueryJobId);
            const items = queryVisibleItems((data.items || []).map(item => ({
                barcode: item.barcode || '',
                order: Number(item.order || 0),
                slot_id: item.slot_id || '',
                slot_label: item.slot_label || '',
                state: item.state || 'waiting',
                status: item.status || '队列等待中',
                retries: Number(item.retries || 0),
                attempts: Number(item.attempts || 0),
                startedAt: item.started_at ? Date.parse(item.started_at.replace(' ', 'T')) : 0,
                elapsed: Number(item.elapsed || 0),
                logs: Array.isArray(item.logs) ? item.logs : []
            })));
            const slots = {};
            items.filter(item => item.state === 'running' && item.slot_id).forEach(item => {
                slots[item.slot_id] = {
                    slot_id: item.slot_id,
                    label: item.slot_label || item.slot_id,
                    barcode: item.barcode,
                    running: true,
                    current: 1,
                    startedAt: item.startedAt || Date.now()
                };
            });
            const failedBarcodes = Array.from(new Set(data.failed_barcodes || []));
            const notices = (data.logs || [])
                .filter(row => ['warn', 'error'].includes(row.level))
                .slice(-5)
                .map(row => row.message || '')
                .filter(Boolean);
            multiBatchJobs = {
                job_id: data.job_id,
                running: !!data.running,
                done: !!data.done,
                pending: [],
                pendingCount: Number(data.pending_count || 0),
                items,
                slots,
                total: Number(data.total || items.length),
                completed: Number(data.completed || 0),
                successCount: Number(data.success_count || 0),
                failedCount: Number(data.failed_count || 0),
                failedBarcodes,
                notices,
                retryLimit: Number(data.retry_limit || 0),
                stopRequested: !!data.stop_requested,
                started_at: data.started_at || '',
                startedAtMs: data.started_at ? Date.parse(data.started_at.replace(' ', 'T')) : 0,
                finishedAtMs: data.finished_at ? Date.parse(data.finished_at.replace(' ', 'T')) : 0
            };
            (data.logs || []).filter(row => Number(row.id || 0) > lastBatchLogSeq).forEach(appendServerLog);
            persistMultiBatchJobs();
            renderQueryBatchSummary();
            renderQueryRealtime(data.running ? '后台查询中' : (data.stop_requested ? '查询已停止' : '查询完成'));
            return true;
        }

        async function doMultiBatchQuery(uniqueBarcodes) {
            if (isBatchRunning || batchStartPending || isMultiBatchRunning) { showToast('批量查询进行中'); return; }
            if (uniqueBarcodes.length === 0) { showToast('没有有效条码'); return; }

            batchStartPending = true;
            saveQueryInput();
            try {
                await loadSlots();
                if (!querySlots.length) {
                    showToast('暂无可用查询通道');
                    return;
                }
                lastBatchLogSeq = 0;
                const response = await fetch('/api/crm/background-batch/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        barcodes: uniqueBarcodes
                    })
                });
                const data = await response.json();
                if (!data.success) {
                    if (data.job_id) {
                        currentBackgroundQueryJobId = data.job_id;
                        sessionStorage.setItem('crm_background_query_job_id', data.job_id);
                        await pollMultiBatchStatus();
                        return;
                    }
                    showToast(data.error || '后台批量查询启动失败');
                    return;
                }
                applyBackgroundQueryStatus(data);
                isMultiBatchRunning = true;
                setQueryButtonsRunning('后台查询中...', '停止后台查询');
                setProgress('queryProgressBar', 0);
                renderQuerySummary(`后台查询已启动，共 ${uniqueBarcodes.length} 个条码`);
                if (!multiBatchPollTimer) {
                    multiBatchPollTimer = setInterval(pollMultiBatchStatus, 1000);
                }
                pollMultiBatchStatus();
            } catch (error) {
                showToast('后台批量查询启动出错：' + error);
            } finally {
                batchStartPending = false;
            }
        }

        async function pollMultiBatchStatus(options={}) {
            if (document.hidden) return;
            if (isMultiBatchPolling) return;
            isMultiBatchPolling = true;
            try {
                const params = new URLSearchParams();
                if (options.latest) {
                    params.set('latest', '1');
                } else if (currentBackgroundQueryJobId) {
                    params.set('job_id', currentBackgroundQueryJobId);
                }
                const response = await fetch('/api/crm/background-batch/status?' + params.toString());
                const data = await response.json();
                if (!data.success || !data.job_id) {
                    isMultiBatchRunning = false;
                    resetQueryButtons();
                    return;
                }
                applyBackgroundQueryStatus(data);
                const total = Number(data.total || 0);
                const completed = Number(data.completed || 0);
                setProgress('queryProgressBar', total ? Math.round(completed / total * 100) : 0);
                if (data.running) {
                    isMultiBatchRunning = true;
                    setQueryButtonsRunning('后台查询中...', '停止后台查询');
                    renderQuerySummary('后台查询中');
                    if (!multiBatchPollTimer) {
                        multiBatchPollTimer = setInterval(pollMultiBatchStatus, 1000);
                    }
                    return;
                }

                isMultiBatchRunning = false;
                if (multiBatchPollTimer) {
                    clearInterval(multiBatchPollTimer);
                    multiBatchPollTimer = null;
                }
                lastQueryItems = multiBatchJobs.items || [];
                sessionStorage.setItem('crm_last_query_items', JSON.stringify(lastQueryItems));
                captureLastQuerySummary();
                renderQuerySummary(data.stop_requested ? '查询已停止' : '查询完成');
                resetQueryButtons();
                checkStatus();
            } catch (error) {
                rememberQueryNotice('后台查询状态读取失败，稍后继续检查');
                if (!multiBatchPollTimer) {
                    multiBatchPollTimer = setInterval(pollMultiBatchStatus, 1000);
                }
            } finally {
                isMultiBatchPolling = false;
            }
        }

        function startQuerySharedSync() {
            if (querySharedSyncTimer) clearInterval(querySharedSyncTimer);
            querySharedSyncTimer = setInterval(() => {
                if (!document.hidden && !isMultiBatchRunning && !batchStartPending) {
                    pollMultiBatchStatus({latest: true});
                }
            }, 2000);
        }

        async function stopBatch() {
            if (!isMultiBatchRunning && !(multiBatchJobs && multiBatchJobs.running)) {
                showToast('当前没有正在查询的任务');
                return;
            }
            log('正在停止后台查询；未完成条码将计入失败条码...', 'warn');
            const response = await fetch('/api/crm/background-batch/stop', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({job_id: currentBackgroundQueryJobId})
            }).then(res => res.json()).catch(() => null);
            if (!response || !response.success) {
                showToast(response?.error || '停止后台查询失败');
                return;
            }
            applyBackgroundQueryStatus(response);
            pollMultiBatchStatus();
        }

        async function startBatchQuery() {
            if (typeof doBatchQuery === 'function') {
                return doBatchQuery();
            }
            log('未找到多线程查询入口，无法启动', 'error');
        }

        async function retryFailedBarcodes() {
            if (isBatchRunning || isMultiBatchRunning) {
                showToast('请先等待当前查询结束');
                return;
            }
            const storedSource = (multiBatchJobs && Array.isArray(multiBatchJobs.failedBarcodes))
                ? multiBatchJobs.failedBarcodes
                : (lastQuerySummary && Array.isArray(lastQuerySummary.failedBarcodesList) ? lastQuerySummary.failedBarcodesList : []);
            const failedBarcodes = Array.from(new Set((storedSource || []).filter(Boolean)));
            if (!failedBarcodes.length) {
                showToast('当前没有失败条码可重查');
                return;
            }
            document.getElementById('batchInput').value = failedBarcodes.join('\n');
            saveQueryInput();
            log(`已将 ${failedBarcodes.length} 个失败条码填入并自动开始查询`, 'warn');
            try {
                await startBatchQuery();
            } catch (e) {
                showToast('重新排队失败：' + (e && e.message ? e.message : e));
            }
        }

        restoreMultiBatchJobs();
        renderQueryBatchSummary();
        checkStatus();
        setInterval(checkStatus, 5000);
        if (currentLoginJobId) {
            startBulkLoginPolling();
        }
        pollMultiBatchStatus({latest: true});
        startQuerySharedSync();

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) pollMultiBatchStatus({latest: true});
        });
        window.addEventListener('pageshow', () => pollMultiBatchStatus({latest: true}));

        // 页面加载时自动填入保存的用户名
        loadSavedCrmCredentials();

        // 页面加载时恢复当前查询窗口自己的条码
        restoreQueryInput();
        if (document.getElementById('batchInput').value) {
            log('已恢复上次的条码列表', 'info');
        }
    </script>
</body>
</html>
